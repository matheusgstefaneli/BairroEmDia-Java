spring.application.name=bairro-em-dia

# Porta: o Render injeta a variavel PORT. Localmente usa 8080.
server.port=${PORT:8080}

# Conexao Oracle FIAP - SEMPRE via variaveis de ambiente (nunca grave credenciais aqui)
# DB_URL exemplo de formato: jdbc:oracle:thin:@HOST:PORTA/SERVICE_NAME  (valores reais vem do SQL Developer)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# As tabelas sao criadas pelos scripts da pasta /sql (o Hibernate NAO altera o banco)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Nao expor detalhes internos nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
